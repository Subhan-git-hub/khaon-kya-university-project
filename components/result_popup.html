<div class="popup_modal_overlay" id="food_result_popup_modal" role="dialog" aria-modal="true">
    <div class="popup_modal_card">
        <button class="popup_close_button" id="close_result_popup_button" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="winner_header_banner">
            <div class="winner_status_pill">
                <i class="fa-solid fa-check"></i> RECOMMENDED MEAL
            </div>
            <div class="winner_food_details">
                <div class="winner_emoji_avatar" id="winner_food_emoji_display">🍔</div>
                <div class="winner_text_block">
                    <span class="winner_small_label">The wheel selected:</span>
                    <h2 class="winner_food_title" id="winner_food_name_display">Burger</h2>
                    <span class="winner_urdu_title" id="winner_food_urdu_display">برگر</span>
                </div>
            </div>
            <p class="winner_quote_text" id="winner_food_quote_display">
                "Assignment submit ho gayi? Ab burger ka haq banta hai!"
            </p>
        </div>

        <div class="popup_subfilters_row">
            <div class="popup_subfilters_info">
                <span class="popup_spots_count_label" id="popup_matching_spots_counter">Found 3 spots</span>
            </div>
            
            <div class="popup_subfilters_actions">
                <div class="popup_radius_pill_group" id="popup_radius_pill_group">
                    <button class="mini_radius_pill active" data-radius="5">All (&le; 5km)</button>
                    <button class="mini_radius_pill" data-radius="0.5">Campus (&le; 0.5km)</button>
                    <button class="mini_radius_pill" data-radius="1.5">&le; 1.5km</button>
                    <button class="mini_radius_pill" data-radius="3.0">&le; 3km</button>
                </div>

                <div class="popup_sort_wrapper">
                    <label for="popup_sort_dropdown">Sort:</label>
                    <select id="popup_sort_dropdown">
                        <option value="distance" selected>Distance (Closest)</option>
                        <option value="rating">Rating (Highest)</option>
                        <option value="price">Budget (Lowest)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="popup_restaurants_scroll_list" id="popup_restaurants_scroll_list">
        </div>

        <div class="popup_bottom_action_bar">
            <button class="popup_secondary_action_button" id="popup_spin_again_button">
                <i class="fa-solid fa-rotate-right"></i> Spin Again
            </button>
            <button class="popup_primary_action_button" id="popup_done_action_button">
                <i class="fa-solid fa-check"></i> Close
            </button>
        </div>
    </div>
</div>
